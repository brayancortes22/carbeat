name: Auto Approve and Merge PRs

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-approve-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve-and-enable-automerge:
    if: >
      !github.event.pull_request.draft &&
      (
        github.event.pull_request.base.ref == 'main' ||
        github.event.pull_request.base.ref == 'qa' ||
        github.event.pull_request.base.ref == 'development'
      ) &&
      (
        contains(github.event.pull_request.labels.*.name, 'automerge') ||
        (vars.AUTO_MERGE_SOURCE_USER != '' && github.event.pull_request.user.login == vars.AUTO_MERGE_SOURCE_USER)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check Automation Token
        id: check_token
        env:
          PR_TOKEN: ${{ secrets.PR_AUTOMATION_TOKEN }}
        run: |
          if [ -n "$PR_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning ::PR_AUTOMATION_TOKEN no configurado en Secrets. No se puede auto-aprobar en nombre del owner." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Auto approve PR (como Brayan)
        if: steps.check_token.outputs.has_token == 'true' && github.event.pull_request.user.login != github.repository_owner
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.PR_AUTOMATION_TOKEN }}

      - name: Enable auto-merge
        if: steps.check_token.outputs.has_token == 'true'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.PR_AUTOMATION_TOKEN }}
          merge-method: squash
